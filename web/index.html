<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#f3f7f1">
  <title>Lista de compras</title>
  <link rel="icon" href="favicon.ico" sizes="32x32">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&display=swap">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main class="pagina">
    <header class="cabecera">
      <h1>Lista de compras</h1>
      <span class="estado" id="estado" data-estado="cargando">Cargando…</span>
    </header>

    <form class="agregar" id="agregar" autocomplete="off">
      <label class="visualmente-oculto" for="nombre">Producto</label>
      <input type="text" id="nombre" list="sugerencias" maxlength="60" placeholder="¿Qué hace falta?" enterkeyhint="done">
      <label class="visualmente-oculto" for="cantidad">Cantidad</label>
      <input type="text" id="cantidad" maxlength="40" placeholder="Cant." inputmode="text">
      <span class="dictar" id="dictar"></span>
      <button type="submit" aria-label="Agregar">+</button>
      <datalist id="sugerencias"></datalist>
    </form>

    <div class="ia-barra" id="ia-barra" role="status" hidden>
      <span id="ia-barra-texto"></span>
      <button type="button" class="ia-ordenar" id="ia-ordenar">✨ Ordenar con IA</button>
      <button type="button" class="ia-barra-cerrar" id="ia-barra-cerrar" aria-label="Cerrar">✕</button>
    </div>

    <p class="error" id="error" hidden></p>

    <section aria-labelledby="titulo-pendientes">
      <h2 id="titulo-pendientes" class="visualmente-oculto">Por comprar</h2>
      <p class="vacio" id="vacio" hidden>No falta nada. 🎉</p>
      <div id="pendientes"></div>
    </section>

    <section class="carrito" id="carrito" hidden aria-labelledby="titulo-carrito">
      <div class="carrito-cabeza">
        <h2 id="titulo-carrito">En el carrito <span id="cuenta-carrito"></span></h2>
        <button type="button" class="enlace" id="limpiar">Limpiar comprados</button>
      </div>
      <ul class="items" id="comprados"></ul>
    </section>
  </main>

  <template id="plantilla">
    <li class="item">
      <button type="button" class="item-marcar" data-accion="marcar">
        <span class="item-check" aria-hidden="true"></span>
        <span class="item-nombre"></span>
        <span class="item-cantidad"></span>
      </button>
      <button type="button" class="item-editar" data-accion="editar">✎</button>
      <button type="button" class="item-borrar" data-accion="borrar">✕</button>
    </li>
  </template>

  <dialog class="hoja" id="editor" aria-labelledby="editor-titulo">
    <form method="dialog" id="editor-form" autocomplete="off">
      <h2 id="editor-titulo">Editar producto</h2>
      <label>Producto
        <input type="text" id="editor-nombre" maxlength="60" required>
      </label>
      <label>Cantidad
        <input type="text" id="editor-cantidad" maxlength="40" placeholder="Ej. 2, 1 kg, 1 paquete">
      </label>
      <label>Sección
        <select id="editor-seccion"></select>
      </label>
      <div class="hoja-botones">
        <button type="button" class="secundario" id="editor-cancelar">Cancelar</button>
        <button type="submit" class="primario" value="guardar">Guardar</button>
      </div>
    </form>
  </dialog>

  <script src="../voz/voz.js"></script>
  <script src="app.js"></script>
</body>
</html>
